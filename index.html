<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro Js</title>
    <link rel="shortcut icon" href="timer.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
    <div id="cont">
        <h1>Cronômetro <span>JS</span></h1>
        <div class="timer">
            <div class="time" id="minutes">00</div>
            <div class="separador">:</div>
            <div class="time" id="seconds">00</div>
            <div class="separador">:</div>
            <div class="time" id="mileseconds">000</div>
        </div>
        <div class="buttons">
            <button id="btn-start">Começar</button>
            <button id="btn-pouse">Pausar</button>
            <button id="btn-resume">Reiniciar</button>
            <button id="btn-reset">Resetar</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
